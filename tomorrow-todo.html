<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내일 할 일</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f1f1d; --muted: #77756e;
    --line: #e4e2db; --accent: #3b6ef5; --accent-soft: #e8eefe;
    --high: #d9473a; --mid: #d9902a; --low: #3c9a5f; --done: #a8a69f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --card: #1f1f1d; --text: #ecebe6; --muted: #9a988f;
      --line: #33322e; --accent: #6f93ff; --accent-soft: #24304f;
      --high: #ef6b5f; --mid: #e8a94c; --low: #5cbd7f; --done: #6b6a64;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --card: #1f1f1d; --text: #ecebe6; --muted: #9a988f;
    --line: #33322e; --accent: #6f93ff; --accent-soft: #24304f;
    --high: #ef6b5f; --mid: #e8a94c; --low: #5cbd7f; --done: #6b6a64;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  header { margin-bottom: 24px; }
  .eyebrow { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .progress { margin-top: 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  form.add {
    display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px;
  }
  input, select, button { font: inherit; color: inherit; }
  input[type="text"], input[type="time"], select {
    border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 8px 10px; min-width: 0;
  }
  input[type="text"] { border: none; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600;
  }
  @media (max-width: 520px) {
    form.add { grid-template-columns: 1fr 1fr; }
    form.add input[type="text"] { grid-column: 1 / -1; border-bottom: 1px solid var(--line); border-radius: 0; }
    form.add button.primary { grid-column: 1 / -1; }
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin: 20px 0 10px; }
  .filters { display: flex; gap: 4px; }
  .filters button, .ghost {
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted);
  }
  .filters button.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.task {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  li.task.dragging { opacity: .4; }
  .check {
    appearance: none; width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 6px; cursor: pointer; flex-shrink: 0; display: grid; place-content: center;
  }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 10px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .body { flex: 1; min-width: 0; }
  .title { word-break: break-word; cursor: text; }
  .title[contenteditable="true"] { outline: 2px solid var(--accent); border-radius: 4px; padding: 0 4px; }
  .meta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dot { display: inline-flex; align-items: center; gap: 4px; }
  .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .p-high { color: var(--high); } .p-mid { color: var(--mid); } .p-low { color: var(--low); }
  li.done .title { text-decoration: line-through; color: var(--done); }
  .actions { display: flex; gap: 2px; }
  .icon {
    background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; font-size: 15px; line-height: 1;
  }
  .icon:hover { background: var(--accent-soft); color: var(--text); }
  .handle { cursor: grab; color: var(--line); user-select: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  footer { margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow" id="dateLabel"></p>
    <h1>내일 할 일</h1>
    <div class="progress">
      <div class="progress-label"><span id="progressText">0 / 0 완료</span><span id="progressPct">0%</span></div>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="newTitle" placeholder="할 일을 입력하고 Enter" maxlength="200" required>
    <input type="time" id="newTime" title="시간 (선택)">
    <select id="newPriority" title="우선순위">
      <option value="high">높음</option>
      <option value="mid" selected>보통</option>
      <option value="low">낮음</option>
    </select>
    <button class="primary" type="submit">추가</button>
  </form>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button data-filter="all" class="active">전체</button>
      <button data-filter="active">남은 일</button>
      <button data-filter="done">완료</button>
    </div>
    <select id="sortBy" class="ghost" title="정렬">
      <option value="manual">직접 정렬</option>
      <option value="time">시간순</option>
      <option value="priority">우선순위순</option>
    </select>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>할 일이 없어요. 내일 할 일을 추가해 보세요.</p>

  <footer>
    <button class="ghost" id="clearDone">완료 항목 삭제</button>
    <button class="ghost" id="exportBtn">텍스트로 복사</button>
  </footer>
</main>

<script>
(() => {
  const KEY = 'tomorrow-todo:v1';
  const PRI_LABEL = { high: '높음', mid: '보통', low: '낮음' };
  const PRI_ORDER = { high: 0, mid: 1, low: 2 };
  const $ = id => document.getElementById(id);

  let tasks = load();
  let filter = 'all';
  let sortBy = 'manual';

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {}
  }

  // 내일 날짜 표시
  const t = new Date(); t.setDate(t.getDate() + 1);
  $('dateLabel').textContent = t.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  function visible() {
    let list = tasks.filter(x => filter === 'all' || (filter === 'done' ? x.done : !x.done));
    if (sortBy === 'time') list = [...list].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    if (sortBy === 'priority') list = [...list].sort((a, b) => PRI_ORDER[a.priority] - PRI_ORDER[b.priority]);
    return list;
  }

  function render() {
    const ul = $('list');
    ul.innerHTML = '';
    for (const task of visible()) {
      const li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '');
      li.dataset.id = task.id;
      li.draggable = sortBy === 'manual';

      const handle = document.createElement('span');
      handle.className = 'handle'; handle.textContent = '⋮⋮';
      handle.hidden = sortBy !== 'manual';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.className = 'check'; cb.checked = task.done;
      cb.setAttribute('aria-label', '완료');
      cb.addEventListener('change', () => { task.done = cb.checked; commit(); });

      const body = document.createElement('div'); body.className = 'body';
      const title = document.createElement('div'); title.className = 'title'; title.textContent = task.title;
      title.title = '더블클릭하여 수정';
      title.addEventListener('dblclick', () => startEdit(title, task));
      const meta = document.createElement('div'); meta.className = 'meta';
      const pri = document.createElement('span'); pri.className = 'dot p-' + task.priority; pri.textContent = PRI_LABEL[task.priority];
      meta.append(pri);
      if (task.time) { const tm = document.createElement('span'); tm.textContent = '🕐 ' + task.time; meta.append(tm); }
      body.append(title, meta);

      const actions = document.createElement('div'); actions.className = 'actions';
      const priBtn = btn('⇅', '우선순위 변경', () => {
        task.priority = { high: 'mid', mid: 'low', low: 'high' }[task.priority]; commit();
      });
      const editBtn = btn('✎', '수정', () => startEdit(title, task));
      const delBtn = btn('✕', '삭제', () => { tasks = tasks.filter(x => x.id !== task.id); commit(); });
      actions.append(priBtn, editBtn, delBtn);

      li.append(handle, cb, body, actions);
      ul.append(li);
    }
    $('empty').hidden = ul.children.length > 0;

    const done = tasks.filter(x => x.done).length;
    const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
    $('progressText').textContent = `${done} / ${tasks.length} 완료`;
    $('progressPct').textContent = pct + '%';
    $('progressBar').style.width = pct + '%';
  }

  function btn(text, label, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'icon'; b.textContent = text; b.title = label; b.setAttribute('aria-label', label);
    b.addEventListener('click', fn);
    return b;
  }

  function startEdit(el, task) {
    el.contentEditable = 'true'; el.focus();
    document.getSelection().selectAllChildren(el);
    const finish = (keep) => {
      el.contentEditable = 'false';
      const v = el.textContent.trim();
      if (keep && v) task.title = v;
      commit();
    };
    el.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); el.onblur = null; finish(true); }
      if (e.key === 'Escape') { el.onblur = null; finish(false); }
    };
    el.onblur = () => finish(true);
  }

  function commit() { save(); render(); }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('newTitle').value.trim();
    if (!title) return;
    tasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title, time: $('newTime').value, priority: $('newPriority').value, done: false
    });
    $('newTitle').value = ''; $('newTime').value = '';
    commit(); $('newTitle').focus();
  });

  $('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.filter;
    [...$('filters').children].forEach(x => x.classList.toggle('active', x === b));
    render();
  });
  $('sortBy').addEventListener('change', e => { sortBy = e.target.value; render(); });

  $('clearDone').addEventListener('click', () => {
    const n = tasks.filter(x => x.done).length;
    if (!n || !confirm(`완료된 항목 ${n}개를 삭제할까요?`)) return;
    tasks = tasks.filter(x => !x.done); commit();
  });

  $('exportBtn').addEventListener('click', async () => {
    const text = `[${$('dateLabel').textContent} 할 일]\n` + tasks.map(x =>
      `${x.done ? '☑' : '☐'} ${x.time ? x.time + ' ' : ''}${x.title} (${PRI_LABEL[x.priority]})`).join('\n');
    try { await navigator.clipboard.writeText(text); alert('클립보드에 복사했어요.'); }
    catch { prompt('아래 내용을 복사하세요', text); }
  });

  // 드래그로 순서 변경 (직접 정렬 모드)
  let dragId = null;
  $('list').addEventListener('dragstart', e => {
    const li = e.target.closest('li'); if (!li) return;
    dragId = li.dataset.id; li.classList.add('dragging');
  });
  $('list').addEventListener('dragend', e => { e.target.closest('li')?.classList.remove('dragging'); });
  $('list').addEventListener('dragover', e => e.preventDefault());
  $('list').addEventListener('drop', e => {
    e.preventDefault();
    const target = e.target.closest('li'); if (!target || !dragId || target.dataset.id === dragId) return;
    const from = tasks.findIndex(x => x.id === dragId);
    const [moved] = tasks.splice(from, 1);
    const to = tasks.findIndex(x => x.id === target.dataset.id);
    const after = e.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
    tasks.splice(after ? to + 1 : to, 0, moved);
    dragId = null; commit();
  });

  render();
})();
</script>
</body>
</html>
